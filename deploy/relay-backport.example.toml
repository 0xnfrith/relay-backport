# relay-backport configuration (TOML; JSON with the same keys also works).
# Precedence: defaults < this file < RELAY_BACKPORT_* environment < CLI flags.
# Point the harness at it with `args: ["acp", "--config", "/path/to/this.toml"]`
# or RELAY_BACKPORT_CONFIG. Placeholders only — never put a token in here.
#
# There is no relay URL and no key: the Buzz harness that spawns relay-backport
# (Buzz Desktop, or a headless buzz-acp) owns both.

# Where the default delivery file lives (deliveries.jsonl). Defaults to the
# per-user state directory: ~/.local/state/relay-backport (XDG_STATE_HOME
# honoured) or %LOCALAPPDATA%\relay-backport on Windows.
# state_dir = "/var/lib/relay-backport"

# One or more of: "file", "webhook", "exec". Default: ["file"].
sinks = ["file"]

# How long a prompt turn waits for the sinks before it ends anyway (the
# acknowledgement then says what is still in flight).
delivery_wait_ms = 15000

# "text" or "json" (stderr; stdout is the ACP stream).
log_format = "text"

[file]
# One MENTION|{json} line per delivery plus EVENT| lifecycle lines.
# `relay-backport tail` follows it. Default: <state_dir>/deliveries.jsonl.
# path = "/var/lib/relay-backport/deliveries.jsonl"
# Write the session's system prompt once to <state_dir>/sessions/<id>.system-prompt.md
# and name it in the EVENT|session|new|... line. Default: true.
system_prompt = true
# (Re)write the harness-injected BUZZ_* identity here on every session/new, so
# a terminal session can `source` it and use the `buzz` CLI as the agent.
# This holds the agent's private key — off by default.
# buzz_env_file = "/var/lib/relay-backport/buzz.env"

[webhook]
url = "https://hooks.example.com/relay-backport"
# bearer_file = "/etc/credstore/relay-backport-webhook.token"
timeout_ms = 8000
attempts = 3
# Attach the session's system prompt (verbatim, ~20-40 KB) to every POST.
include_system_prompt = true

[exec]
command = ["/usr/local/bin/handle-mention", "--from-relay"]
timeout_ms = 60000
# Hand the harness-injected BUZZ_* variables (relay URL, private key, auth
# tag) to the hook so it can reply with the `buzz` CLI as the agent. Off by
# default: the hook then sees only a minimal environment.
pass_buzz_env = false
# Attach the session's system prompt (verbatim) to the stdin JSON. Off by
# default: an exec hook is usually short-lived and does not need it repeated.
include_system_prompt = false
