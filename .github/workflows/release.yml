name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: tag must equal v${VERSION}
        run: |
          VERSION=$(bun -e 'import { VERSION } from "./src/version.ts"; console.log(VERSION)')
          TAG="${GITHUB_REF_NAME}"
          echo "version=$VERSION tag=$TAG"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match v$VERSION from src/version.ts (package.json); bump the version or fix the tag"
            exit 1
          fi
      - run: bunx tsc --noEmit
      - run: bun test
      - name: compile all targets
        run: |
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/relay-backport-linux-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/relay-backport-darwin-arm64
          bun build --compile --target=bun-windows-x64 src/cli.ts --outfile dist/relay-backport-windows-x64.exe
      - name: checksums
        working-directory: dist
        run: sha256sum relay-backport-* > SHA256SUMS
      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/relay-backport-linux-x64
            dist/relay-backport-darwin-arm64
            dist/relay-backport-windows-x64.exe
            dist/SHA256SUMS
          generate_release_notes: true
