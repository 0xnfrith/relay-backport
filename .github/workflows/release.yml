name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # `$/` (zizmor's suggestion) is rejected by actionlint 1.7.12; for a job-level
    # reusable workflow GitHub resolves `./` at the running commit either way.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag must be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: tag must equal v${VERSION}
        run: |
          VERSION=$(bun -e 'import { VERSION } from "./src/version.ts"; console.log(VERSION)')
          TAG="${GITHUB_REF_NAME}"
          echo "version=$VERSION tag=$TAG"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match v$VERSION from src/version.ts (package.json); bump the version or fix the tag"
            exit 1
          fi
      - name: compile all targets
        run: |
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/relay-backport-linux-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/relay-backport-darwin-arm64
          bun build --compile --target=bun-windows-x64 src/cli.ts --outfile dist/relay-backport-windows-x64.exe
      - name: checksums
        working-directory: dist
        run: sha256sum relay-backport-* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/relay-backport-*
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
