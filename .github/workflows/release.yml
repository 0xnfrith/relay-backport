name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: compile all targets
        run: |
          bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/relay-backport-linux-x64
          bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/relay-backport-darwin-arm64
          bun build --compile --target=bun-windows-x64 src/cli.ts --outfile dist/relay-backport-windows-x64.exe
      - name: checksums
        working-directory: dist
        run: sha256sum relay-backport-* > SHA256SUMS
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/relay-backport-linux-x64
            dist/relay-backport-darwin-arm64
            dist/relay-backport-windows-x64.exe
            dist/SHA256SUMS
          generate_release_notes: true
