name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  compile:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: compile linux-x64
        run: bun build --compile --target=bun-linux-x64 src/cli.ts --outfile dist/relay-backport-linux-x64
      - name: compile darwin-arm64
        run: bun build --compile --target=bun-darwin-arm64 src/cli.ts --outfile dist/relay-backport-darwin-arm64
      - name: compile windows-x64
        run: bun build --compile --target=bun-windows-x64 src/cli.ts --outfile dist/relay-backport-windows-x64.exe
      - name: smoke the linux binary
        run: |
          ./dist/relay-backport-linux-x64 --version
          ./dist/relay-backport-linux-x64 --help > /dev/null
      - name: binary end-to-end (linux)
        run: bun test test/binary.test.ts
        env:
          RELAY_BACKPORT_BIN: ${{ github.workspace }}/dist/relay-backport-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f deploy/Dockerfile -t relay-backport:ci .
      - run: docker run --rm relay-backport:ci --version
